[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20", "yarn"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build",
  "php artisan key:generate",
  "php artisan migrate --force"
]

[phases.start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"

[variables]
APP_ENV = "production"
APP_DEBUG = "false"
APP_KEY = "{{ env.APP_KEY }}"
CACHE_DRIVER = "file"
SESSION_DRIVER = "file"
QUEUE_CONNECTION = "sync"

[static]
# Serve public directory
guest = "."
